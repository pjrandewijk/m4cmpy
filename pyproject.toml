[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "m4cmpy"
version = "4.0.0"
description = "Standalone PDF, PNG, JPG, SVG and EPS figures from M4 Circuit Macros, using only Python and a TeX distribution"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Peter Jan Randewijk" }]
requires-python = ">=3.10"
dependencies = ["pym4>=1.0", "pppic>=1.0"]
keywords = ["circuit macros", "m4", "dpic", "pstricks", "latex", "circuit diagrams", "electrical engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Homepage = "https://github.com/pjrandewijk/m4cmpy"
Blog = "https://m4cmpy.wordpress.com"
Issues = "https://github.com/pjrandewijk/m4cmpy/issues"

[project.scripts]
m4cm = "m4cmpy:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
m4cmpy = ["default.ltx"]
