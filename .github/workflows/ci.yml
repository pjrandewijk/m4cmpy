name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"  # weekly, to catch changes in pym4 and pppic

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install git+https://github.com/pjrandewijk/pym4 git+https://github.com/pjrandewijk/pppic
      - run: python -m pip install .
      - run: m4cm --get-cm
      - run: python -m unittest discover -s tests -v

  figures:
    name: Figures with TeX Live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended \
            texlive-pstricks texlive-font-utils dvisvgm ghostscript
      - run: python -m pip install git+https://github.com/pjrandewijk/pym4 git+https://github.com/pjrandewijk/pppic
      - run: python -m pip install .
      - run: m4cm --get-cm
      - run: python -m unittest discover -s tests -v
      - name: Build the example with the built-in template
        run: |
          mkdir figures
          cp "My Examples/ex0.m4cm" figures/
          cd figures
          m4cm -p -n -s ex0.m4cm
      - uses: actions/upload-artifact@v7
        with:
          name: figures
          path: figures/
